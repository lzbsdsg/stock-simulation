server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:400}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:50}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:20000}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:60000}
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5000}

spring:
  application:
    name: stock-simulation
  profiles:
    active: dev

  # ---- 数据库 ----
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_simulation}
    username: ${DB_USER:stock_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      database: 0
      lettuce:
        cluster:
          refresh:
            adaptive: ${REDIS_CLUSTER_REFRESH_ADAPTIVE:true}
            period: ${REDIS_CLUSTER_REFRESH_PERIOD:30s}
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:64}
          max-idle: ${REDIS_POOL_MAX_IDLE:32}
          min-idle: ${REDIS_POOL_MIN_IDLE:8}

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:stock_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ---- 邮件 ----
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ---- MyBatis-Plus ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"

# ---- JWT ----
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 28800000 # 8 小时 (ms)
  refresh-token-expiration: 604800000 # 7 天 (ms)

# ---- 交易规则 ----
trade:
  rule:
    morning-start: "09:30"
    morning-end: "11:30"
    afternoon-start: "13:00"
    afternoon-end: "15:00"
    min-quantity: 100
    normal-limit-rate: 0.10
    st-limit-rate: 0.05
    gem-star-limit-rate: 0.20
    commission-rate: 0.0003
  settlement:
    close-cron: "0 0 15 * * MON-FRI"
    archive-cron: "0 30 3 * * *"
    archive-retain-days: 7
    archive-batch-size: 500

# ---- 行情采样开关 ----
market:
  visible-codes:
    report-min-interval-ms: ${MARKET_VISIBLE_CODES_REPORT_MIN_INTERVAL_MS:1200}
    cleanup-interval-ms: ${MARKET_VISIBLE_CODES_CLEANUP_INTERVAL_MS:60000}
  kline:
    # 东方财富历史K线复权模式: 0=不复权, 1=前复权, 2=后复权
    fqt: ${MARKET_KLINE_FQT:1}
    prewarm:
      enabled: ${MARKET_KLINE_PREWARM_ENABLED:true}
      codes: ${MARKET_KLINE_PREWARM_CODES:sh600519,sz000001,sh601318}
  ingest:
    enabled: ${MARKET_INGEST_ENABLED:true}
    pull-interval-ms: ${MARKET_INGEST_PULL_INTERVAL_MS:1000}
    renew-interval-ms: ${MARKET_INGEST_RENEW_INTERVAL_MS:3000}
    active-window-ms: ${MARKET_INGEST_ACTIVE_WINDOW_MS:8000}
    active-batch-size: ${MARKET_INGEST_ACTIVE_BATCH_SIZE:800}
    round-robin-batch-size: ${MARKET_INGEST_ROUND_ROBIN_BATCH_SIZE:100}
    stock-universe-refresh-ms: ${MARKET_INGEST_STOCK_UNIVERSE_REFRESH_MS:300000}
    latency-sample-enabled: ${MARKET_INGEST_LATENCY_SAMPLE_ENABLED:false}
  broadcast:
    mode: ${MARKET_BROADCAST_MODE:redis}
  redis:
    pubsub:
      enabled: ${MARKET_REDIS_PUBSUB_ENABLED:true}
  websocket:
    max-connections: ${MARKET_WS_MAX_CONNECTIONS:50000}
    quote-destination-prefix: ${MARKET_WS_QUOTE_DESTINATION_PREFIX:/topic/market/quote/}
    backpressure-queue-depth: ${MARKET_WS_BACKPRESSURE_QUEUE_DEPTH:1000}
    payload-bytes-limit: ${MARKET_WS_PAYLOAD_BYTES_LIMIT:65536}
    payload-size-check-enabled: ${MARKET_WS_PAYLOAD_SIZE_CHECK_ENABLED:false}
    attach-push-timestamp: ${MARKET_WS_ATTACH_PUSH_TIMESTAMP:false}
    push-interval-ms: ${MARKET_WS_PUSH_INTERVAL_MS:200}
    degraded-push-interval-ms: ${MARKET_WS_DEGRADED_PUSH_INTERVAL_MS:1000}
    degrade-lag-threshold-ms: ${MARKET_WS_DEGRADE_LAG_THRESHOLD_MS:5000}
    dispatch-interval-ms: ${MARKET_WS_DISPATCH_INTERVAL_MS:100}
    dispatch-enabled: ${MARKET_WEBSOCKET_DISPATCH_ENABLED:true}
    drain-batch-size: ${MARKET_WS_DRAIN_BATCH_SIZE:64}
    degraded-drain-batch-size: ${MARKET_WS_DEGRADED_DRAIN_BATCH_SIZE:256}
    broker:
      inbound-core-pool-size: ${MARKET_WS_BROKER_INBOUND_CORE_POOL_SIZE:4}
      inbound-max-pool-size: ${MARKET_WS_BROKER_INBOUND_MAX_POOL_SIZE:16}
      outbound-core-pool-size: ${MARKET_WS_BROKER_OUTBOUND_CORE_POOL_SIZE:8}
      outbound-max-pool-size: ${MARKET_WS_BROKER_OUTBOUND_MAX_POOL_SIZE:32}
      queue-capacity: ${MARKET_WS_BROKER_QUEUE_CAPACITY:5000}
      relay-enabled: ${MARKET_WS_BROKER_RELAY_ENABLED:false}
      relay-host: ${MARKET_WS_BROKER_RELAY_HOST:localhost}
      relay-port: ${MARKET_WS_BROKER_RELAY_PORT:61613}
      client-login: ${MARKET_WS_BROKER_CLIENT_LOGIN:guest}
      client-passcode: ${MARKET_WS_BROKER_CLIENT_PASSCODE:guest}
      system-login: ${MARKET_WS_BROKER_SYSTEM_LOGIN:guest}
      system-passcode: ${MARKET_WS_BROKER_SYSTEM_PASSCODE:guest}
      virtual-host: ${MARKET_WS_BROKER_VIRTUAL_HOST:/}
    transport:
      message-size-limit: ${MARKET_WS_TRANSPORT_MESSAGE_SIZE_LIMIT:65536}
      send-buffer-size-limit: ${MARKET_WS_TRANSPORT_SEND_BUFFER_SIZE_LIMIT:524288}
      send-time-limit-ms: ${MARKET_WS_TRANSPORT_SEND_TIME_LIMIT_MS:15000}

app:
  redis:
    cluster:
      map-to-loopback: ${APP_REDIS_CLUSTER_MAP_TO_LOOPBACK:true}
  ratelimit:
    enabled: ${APP_RATELIMIT_ENABLED:true}
    limit-multiplier: ${APP_RATELIMIT_LIMIT_MULTIPLIER:1.0}
    trust-identity-header: ${APP_RATELIMIT_TRUST_IDENTITY_HEADER:false}
    identity-header: ${APP_RATELIMIT_IDENTITY_HEADER:X-RateLimit-Identity}
  async:
    core-pool-size: ${APP_ASYNC_CORE_POOL_SIZE:8}
    max-pool-size: ${APP_ASYNC_MAX_POOL_SIZE:32}
    queue-capacity: ${APP_ASYNC_QUEUE_CAPACITY:500}
    keep-alive-seconds: ${APP_ASYNC_KEEP_ALIVE_SECONDS:60}
  rabbit:
    match:
      prefetch: ${APP_RABBIT_MATCH_PREFETCH:10}
      concurrent-consumers: ${APP_RABBIT_MATCH_CONCURRENT_CONSUMERS:8}
      max-concurrent-consumers: ${APP_RABBIT_MATCH_MAX_CONCURRENT_CONSUMERS:8}
  security:
    swagger-enabled: ${APP_SECURITY_SWAGGER_ENABLED:true}
    password:
      bcrypt-strength: ${APP_SECURITY_PASSWORD_BCRYPT_STRENGTH:12}
    cors:
      allowed-origin-patterns: ${APP_SECURITY_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://*.yourdomain.com}
    k6-bypass:
      enabled: ${APP_SECURITY_K6_BYPASS_ENABLED:false}
      key: ${APP_SECURITY_K6_BYPASS_KEY:}
      user-id: ${APP_SECURITY_K6_BYPASS_USER_ID:1}
      role: ${APP_SECURITY_K6_BYPASS_ROLE:USER}

portfolio:
  snapshot:
    daily-cron: "0 15 15 * * MON-FRI"
    unfreeze-cron: "0 25 9 * * MON-FRI"
    batch-size: 500
    lock-ttl-minutes: 30

# ---- SpringDoc ----
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${app.security.swagger-enabled}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${app.security.swagger-enabled}
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
    try-it-out-enabled: true

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: ${APP_MANAGEMENT_EXPOSED_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: when-authorized

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.lzbsdsg.stocksimulation: INFO
    org.springframework.security: WARN
    org.springframework.web.socket: WARN
    org.springframework.messaging: WARN
    com.lzbsdsg.stocksimulation.market.infrastructure.websocket.MarketWebSocketHandler: INFO
    org.springframework.web.SimpLogging: INFO
