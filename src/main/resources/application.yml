server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: stock-simulation
  profiles:
    active: dev

  # ---- 数据库 ----
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_simulation}
    username: ${DB_USER:stock_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:stock_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ---- 邮件 ----
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ---- MyBatis-Plus ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"

# ---- JWT ----
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000     # 30 分钟 (ms)
  refresh-token-expiration: 604800000  # 7 天 (ms)

# ---- 交易规则 ----
trade:
  rule:
    morning-open: "09:30"
    morning-close: "11:30"
    afternoon-open: "13:00"
    afternoon-close: "15:00"
    min-quantity: 100
    normal-limit-rate: 0.10
    st-limit-rate: 0.05
    gem-star-limit-rate: 0.20
    commission-rate: 0.0003

# ---- SpringDoc ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
    try-it-out-enabled: true

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.lzbsdsg.stocksimulation: DEBUG
    org.springframework.security: DEBUG
