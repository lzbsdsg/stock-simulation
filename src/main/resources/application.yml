server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: stock-simulation
  profiles:
    active: dev

  # ---- 数据库 ----
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stock_simulation}
    username: ${DB_USER:stock_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:stock_app}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: /

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # ---- 邮件 ----
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ---- MyBatis-Plus ----
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-not-delete-value: "null"

# ---- JWT ----
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 28800000 # 8 小时 (ms)
  refresh-token-expiration: 604800000 # 7 天 (ms)

# ---- 交易规则 ----
trade:
  rule:
    morning-start: "09:30"
    morning-end: "11:30"
    afternoon-start: "13:00"
    afternoon-end: "15:00"
    min-quantity: 100
    normal-limit-rate: 0.10
    st-limit-rate: 0.05
    gem-star-limit-rate: 0.20
    commission-rate: 0.0003
  settlement:
    close-cron: "0 0 15 * * MON-FRI"
    archive-cron: "0 30 3 * * *"
    archive-retain-days: 7
    archive-batch-size: 500

# ---- 行情采样开关 ----
market:
  kline:
    # 东方财富历史K线复权模式: 0=不复权, 1=前复权, 2=后复权
    fqt: ${MARKET_KLINE_FQT:1}
  ingest:
    pull-interval-ms: ${MARKET_INGEST_PULL_INTERVAL_MS:1000}
    renew-interval-ms: ${MARKET_INGEST_RENEW_INTERVAL_MS:3000}
    active-window-ms: ${MARKET_INGEST_ACTIVE_WINDOW_MS:8000}
    active-batch-size: ${MARKET_INGEST_ACTIVE_BATCH_SIZE:800}
    round-robin-batch-size: ${MARKET_INGEST_ROUND_ROBIN_BATCH_SIZE:100}
    stock-universe-refresh-ms: ${MARKET_INGEST_STOCK_UNIVERSE_REFRESH_MS:300000}
    latency-sample-enabled: ${MARKET_INGEST_LATENCY_SAMPLE_ENABLED:false}
  websocket:
    max-connections: ${MARKET_WS_MAX_CONNECTIONS:10000}
    backpressure-queue-depth: ${MARKET_WS_BACKPRESSURE_QUEUE_DEPTH:100}
    payload-bytes-limit: ${MARKET_WS_PAYLOAD_BYTES_LIMIT:65536}
    push-interval-ms: ${MARKET_WS_PUSH_INTERVAL_MS:1000}
    degraded-push-interval-ms: ${MARKET_WS_DEGRADED_PUSH_INTERVAL_MS:10000}
    degrade-lag-threshold-ms: ${MARKET_WS_DEGRADE_LAG_THRESHOLD_MS:5000}
    dispatch-interval-ms: ${MARKET_WS_DISPATCH_INTERVAL_MS:500}

portfolio:
  snapshot:
    daily-cron: "0 15 15 * * MON-FRI"
    unfreeze-cron: "0 25 9 * * MON-FRI"
    batch-size: 500
    lock-ttl-minutes: 30

# ---- SpringDoc ----
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    persist-authorization: true
    try-it-out-enabled: true

# ---- 头像存储 ----
avatar:
  storage:
    root-dir: ${AVATAR_STORAGE_ROOT_DIR:uploads}
    public-prefix: ${AVATAR_PUBLIC_PREFIX:/uploads}
    max-size-bytes: ${AVATAR_MAX_SIZE_BYTES:2097152}

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.lzbsdsg.stocksimulation: DEBUG
    org.springframework.security: DEBUG
    com.lzbsdsg.stocksimulation.market.infrastructure.websocket.MarketWebSocketHandler: INFO
    org.springframework.web.SimpLogging: INFO
