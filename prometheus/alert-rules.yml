groups:
  - name: stock-simulation-alerts
    rules:
      - alert: HighHttp5xxRateCritical
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.000001)
          > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 错误率 > 1%"

      - alert: HighApiP99LatencyWarning
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/.*"}[5m]))
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API P99 延迟 > 500ms"

      - alert: PerfBaselineFullChainP99Warning
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{
                uri=~"/api/v1/(market/quote/.*|market/search|portfolio/overview|portfolio/positions|trade/orders|trade/trades)"
              }[5m])
            )
          ) > 0.06
        for: 3m
        labels:
          severity: warning
          slo: "full_chain_p99_lt_60ms"
        annotations:
          summary: "性能基准告警：核心全链路近似 P99 > 60ms"

      - alert: PerfBaselineBusinessErrorCritical
        expr: |
          sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",status=~"5.."}[5m])) > 0
          or
          sum(rate(http_server_requests_seconds_count{uri=~"/api/v1/.*",status="429"}[5m])) > 5
        for: 2m
        labels:
          severity: critical
          slo: "business_failure_eq_0"
        annotations:
          summary: "性能基准告警：核心 API 出现 5xx 或持续限流"

      - alert: JvmHeapHighWarning
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{area="heap"}), 1)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆使用率 > 80%"

      - alert: AppHeapImbalanceWarning
        expr: |
          (
            max by (app) (
              sum by (instance, app) (jvm_memory_used_bytes{area="heap", app="stock-simulation"})
            )
            /
            clamp_min(
              min by (app) (
                sum by (instance, app) (jvm_memory_used_bytes{area="heap", app="stock-simulation"})
              ),
              1
            )
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用实例堆内存使用不均衡，最大/最小 > 3"

      - alert: AppCpuImbalanceWarning
        expr: |
          (
            max by (app) (process_cpu_usage{app="stock-simulation"})
            /
            clamp_min(min by (app) (process_cpu_usage{app="stock-simulation"}), 0.001)
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "应用实例 CPU 使用不均衡，最大/最小 > 3"

      - alert: WsConnectionImbalanceWarning
        expr: |
          (
            max by (app) (ws_active_connections{app="stock-simulation"})
            -
            min by (app) (ws_active_connections{app="stock-simulation"})
          ) > 1000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "WebSocket 连接在应用实例间分布不均衡"

      - alert: DbPoolExhaustedCritical
        expr: |
          max(hikaricp_connections_active{pool=~"master-pool|slave-pool"}) by (pool)
          / clamp_min(max(hikaricp_connections_max{pool=~"master-pool|slave-pool"}) by (pool), 1)
          > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "数据库连接池接近耗尽 (>95%)"

      - alert: MqQueueDepthHighWarning
        expr: sum(rabbitmq_queue_messages{queue!~".*dlq.*"}) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MQ 队列堆积 > 1000"

      - alert: TradeMatchP99HighWarning
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(trade_match_duration_seconds_bucket[5m]))) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "撮合延迟 P99 > 1s"

      - alert: L1CacheHitRateLowWarning
        expr: |
          (
            sum(rate(market_quote_cache_hit_total{level="L1"}[5m]))
            /
            clamp_min(sum(rate(market_quote_cache_hit_total{level=~"L1|L2"}[5m])), 0.000001)
          ) < 0.6
          and sum(rate(market_quote_cache_hit_total{level=~"L1|L2"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "L1 缓存命中率 < 60%"

      - alert: WsConnectionsHighWarning
        expr: max(ws_active_connections) > 8000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "WS 连接数 > 8000/实例"

      - alert: PgReplicationLagHighWarning
        expr: max(pg_replication_lag) > 1 or max(pg_stat_replication_replay_lag_seconds) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 复制延迟 > 1s"

      - alert: LoginFailureRateHighWarning
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{uri="/api/v1/auth/login",status=~"4..|5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{uri="/api/v1/auth/login"}[5m])), 0.000001)
          ) > 0.3
          and sum(rate(http_server_requests_seconds_count{uri="/api/v1/auth/login"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "登录失败率 > 30%"

      - alert: WsPushDroppedHighWarning
        expr: rate(ws_push_dropped_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WS 背压丢弃速率持续偏高 (>10/s)"

      - alert: DlqMessagesCritical
        expr: rabbitmq_queue_messages{queue=~".*dlq.*"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "死信队列有消息堆积"
