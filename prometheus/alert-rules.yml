groups:
  - name: stock-simulation-alerts
    rules:
      - alert: HighHttp5xxRateCritical
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.000001)
          > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 错误率 > 1%"

      - alert: HighApiP99LatencyWarning
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api/.*"}[5m]))
          ) > 0.5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API P99 延迟 > 500ms"

      - alert: JvmHeapHighWarning
        expr: |
          sum(jvm_memory_used_bytes{area="heap"})
          / clamp_min(sum(jvm_memory_max_bytes{area="heap"}), 1)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆使用率 > 80%"

      - alert: DbPoolExhaustedCritical
        expr: |
          max(hikaricp_connections_active{pool=~"master-pool|slave-pool"}) by (pool)
          / clamp_min(max(hikaricp_connections_max{pool=~"master-pool|slave-pool"}) by (pool), 1)
          > 0.95
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "数据库连接池接近耗尽 (>95%)"

      - alert: MqQueueDepthHighWarning
        expr: sum(rabbitmq_queue_messages{queue!~".*dlq.*"}) > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "MQ 队列堆积 > 1000"

      - alert: TradeMatchP99HighWarning
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(trade_match_duration_seconds_bucket[5m]))) > 1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "撮合延迟 P99 > 1s"

      - alert: L1CacheHitRateLowWarning
        expr: |
          (
            sum(rate(market_quote_cache_hit_total{level="L1"}[5m]))
            /
            clamp_min(sum(rate(market_quote_cache_hit_total{level=~"L1|L2"}[5m])), 0.000001)
          ) < 0.6
          and sum(rate(market_quote_cache_hit_total{level=~"L1|L2"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "L1 缓存命中率 < 60%"

      - alert: WsConnectionsHighWarning
        expr: max(ws_active_connections) > 8000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "WS 连接数 > 8000/实例"

      - alert: PgReplicationLagHighWarning
        expr: max(pg_replication_lag) > 1 or max(pg_stat_replication_replay_lag_seconds) > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL 复制延迟 > 1s"

      - alert: LoginFailureRateHighWarning
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{uri="/api/v1/auth/login",status=~"4..|5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{uri="/api/v1/auth/login"}[5m])), 0.000001)
          ) > 0.3
          and sum(rate(http_server_requests_seconds_count{uri="/api/v1/auth/login"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "登录失败率 > 30%"

      - alert: WsPushDroppedHighWarning
        expr: rate(ws_push_dropped_total[5m]) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "WS 背压丢弃速率持续偏高 (>10/s)"

      - alert: DlqMessagesCritical
        expr: rabbitmq_queue_messages{queue=~".*dlq.*"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "死信队列有消息堆积"
