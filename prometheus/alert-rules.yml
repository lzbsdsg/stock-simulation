# Prometheus 告警规则
groups:
  - name: stock-simulation-alerts
    rules:
      # ---- 应用层 ----
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.001
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "错误率 > 0.1%"

      - alert: HighP99Latency_Trade
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{uri=~"/api/v1/orders.*"}[5m])) > 0.2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "交易接口 P99 > 200ms"

      - alert: HighP99Latency_Market
        expr: histogram_quantile(0.99, rate(http_server_requests_seconds_bucket{uri=~"/api/v1/market.*"}[5m])) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "行情接口 P99 > 100ms"

      # ---- JVM ----
      - alert: HighHeapUsage
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM 堆内存使用 > 85%"

      # ---- 数据库 ----
      - alert: ReplicationLag
        expr: pg_stat_replication_replay_lag_seconds > 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 复制延迟 > 1s"

      - alert: HighConnectionUsage
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "连接池使用率 > 80%"

      # ---- Redis ----
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis 内存 > 85%"

      # ---- WebSocket ----
      - alert: HighWsConnections
        expr: ws_connections_active > 8000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "WS 连接数 > 8000/实例（接近上限 10000）"

      # ---- MQ ----
      - alert: DLQMessages
        expr: rabbitmq_queue_messages{queue=~".*dlq.*"} > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "死信队列有消息堆积"
