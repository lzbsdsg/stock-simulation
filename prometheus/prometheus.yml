# Prometheus 配置
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert-rules.yml"

scrape_configs:
  # Spring Boot Actuator / Micrometer
  - job_name: "stock-simulation"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "app-1:8081"
          - "app-2:8081"
        labels:
          app: "stock-simulation"

  # RabbitMQ
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]

  # PostgreSQL exporter
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Tempo metrics
  - job_name: "tempo"
    static_configs:
      - targets: ["tempo:3200"]

  # Promtail metrics
  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
