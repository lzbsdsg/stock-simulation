server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: stock-app-1
    static_configs:
      - targets: [localhost]
        labels:
          job: stock-app
          instance: app-1
          __path__: /var/log/stock/app-1/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: mdc.traceId
            userId: mdc.userId
      - labels:
          level:
          traceId:
          userId:

  - job_name: stock-app-2
    static_configs:
      - targets: [localhost]
        labels:
          job: stock-app
          instance: app-2
          __path__: /var/log/stock/app-2/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            traceId: mdc.traceId
            userId: mdc.userId
      - labels:
          level:
          traceId:
          userId:
