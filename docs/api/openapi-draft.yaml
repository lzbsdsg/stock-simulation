## API 8: 获取单只股票行情快照

```
GET /api/v1/market/quote/{stockCode}
Auth: Bearer Token
RateLimit: 60/min
SLO: P95 < 50ms, P99 < 100ms

Path Params:
- stockCode: 股票代码，如 "sh600519"（上证）或 "sz000001"（深证）

Response 200:
{
  "code": "000000",
  "data": {
    "stockCode": "sh600519",
    "stockName": "贵州茅台",
    "currentPrice": 1688.00,
    "openPrice": 1680.00,
    "closePrice": 1675.50,
    "highPrice": 1695.00,
    "lowPrice": 1670.00,
    "volume": 2356800,
    "amount": 3976543200.00,
    "changePercent": 0.75,
    "changeAmount": 12.50,
    "limitUp": 1843.05,
    "limitDown": 1508.00,
    "timestamp": "2026-02-13T14:35:00+08:00"
  }
}

Response Headers:
  X-Cache-Status: HIT-L1
  X-RateLimit-Limit: 60
  X-RateLimit-Remaining: 55
  X-RateLimit-Reset: 1739462520

Error Codes:
- MARKET_STOCK_NOT_FOUND: 股票代码不存在
- MARKET_DATA_UNAVAILABLE: 行情数据暂不可用（降级返回stale缓存时 code=000000 + X-Cache-Status=STALE）

缓存路径:
  L1 Caffeine (TTL=3s, max=5000) → L2 Redis (TTL=5s) → Provider回源
  典型延迟: L1 <1ms, L2 <5ms, 回源 <100ms
```

