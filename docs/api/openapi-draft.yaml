## API 4: 刷新 Token

```
POST /api/v1/auth/refresh
Auth: 不需要（但需要 Refresh Token）
SLO: P99 < 100ms

Request Body:
{
  "refreshToken": "eyJhbGciOi..."
}

Response 200:
{
  "code": "000000",
  "data": {
    "accessToken": "eyJhbGciOi...(new)",
    "refreshToken": "eyJhbGciOi...(new)",
    "expiresIn": 1800
  }
}

Error Codes:
- AUTH_REFRESH_TOKEN_EXPIRED: Refresh Token 已过期
- AUTH_REFRESH_TOKEN_INVALID: Refresh Token 无效（已轮换/已登出）

实现说明:
- Refresh Token Rotation：旧token立即加入Redis黑名单
- 新token对立即签发
```

