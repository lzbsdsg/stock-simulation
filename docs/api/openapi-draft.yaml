## WebSocket 端点

```
连接：ws(s)://{host}/ws/market
协议：STOMP over SockJS
鉴权：连接时 header 携带 Authorization: Bearer {token}
连接限制：单实例最大 10000 连接，超限返回 HTTP 503

订阅频道：
- /topic/quotes/{userId}         → 自选股行情推送(3s/次)
- /user/queue/trade-notify       → 个人成交通知
- /topic/system-broadcast        → 系统广播

行情推送消息格式：
{
  "type": "QUOTE_UPDATE",
  "data": [
    { "stockCode": "sh600519", "currentPrice": 1690.50, "changePercent": 0.90, "volume": 2400000 },
    ...
  ],
  "timestamp": "2026-02-13T14:35:03+08:00"
}

成交通知消息格式：
{
  "type": "TRADE_FILLED",
  "data": {
    "orderId": 20001,
    "stockName": "贵州茅台",
    "side": "BUY",
    "price": 1688.00,
    "quantity": 100
  }
}

架构说明 (v2.0):
- Nginx ip_hash 保证同一用户 WS 粘性到同一 App 实例
- 每个 App 实例维护本地连接注册表 (ConcurrentHashMap)
- 行情数据由 MarketIngestService(分布式锁选主) 拉取 → Redis Pub/Sub 广播
- 所有 App 实例订阅 Pub/Sub → 更新本地 L1 Caffeine → 推送管理的 WS 连接

背压控制:
- 推送队列深度 > 100: 丢弃该连接最旧消息（非关键行情可丢）
- 推送延迟 > 5s: 降级为10s推送周期
- 单连接发送缓冲区 > 64KB: 暂停推送，等缓冲区消化

断线重连协议 (客户端):
- 断线后立即重连
- 重连失败 → 指数退避: 1s → 2s → 4s → 8s → 16s → 30s(max)
- 每次重连重新鉴权 (JWT)
- 重连成功后重新订阅频道（服务端不保留订阅状态）
```

