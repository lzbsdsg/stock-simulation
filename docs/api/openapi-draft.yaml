## API 1: 发送邮箱验证码

```
POST /api/v1/auth/otp/send
Auth: 不需要
RateLimit: 同一邮箱 60s/次，同一IP 20次/h
SLO: P99 < 300ms

Request Body:
{
  "email": "user@example.com"
}

Response 200:
{
  "code": "000000",
  "message": "验证码已发送",
  "data": { "expireSeconds": 300 }
}

Response Headers:
  X-RateLimit-Limit: 1
  X-RateLimit-Remaining: 0
  X-RateLimit-Reset: 1739462460

Error Codes:
- AUTH_OTP_RATE_LIMITED: 发送过于频繁，请60秒后重试
- AUTH_OTP_EMAIL_INVALID: 邮箱格式不正确

实现说明:
- 邮件发送走 RabbitMQ 异步，API 立即返回
- Redis SETNX 实现频率限制：otp:limit:{email} TTL=60s
- IP 限制：otp:ip:{ip} INCR + TTL=3600s
```

