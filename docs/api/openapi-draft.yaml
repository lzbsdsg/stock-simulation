## API 2: 邮箱验证码注册

```
POST /api/v1/auth/register
Auth: 不需要
SLO: P99 < 300ms

Request Body:
{
  "email": "user@example.com",
  "otp": "123456",
  "password": "MyPass123",
  "nickname": "股民小张",
  "initialBalance": 100000.00
}

Response 200:
{
  "code": "000000",
  "data": {
    "accessToken": "eyJhbGciOi...",
    "refreshToken": "eyJhbGciOi...",
    "expiresIn": 1800,
    "userId": 10001
  }
}

Error Codes:
- AUTH_OTP_EXPIRED: 验证码已过期
- AUTH_OTP_INVALID: 验证码不正确
- AUTH_REGISTER_EMAIL_EXISTS: 邮箱已注册
- AUTH_PASSWORD_TOO_WEAK: 密码不符合要求（≥8位，需含大小写+数字）
- USER_BALANCE_EXCEED_LIMIT: 初始资金超过上限(1,000,000)

实现说明:
- OTP 验证后立即删除 Redis key（一次性）
- 事务内创建 User + Account
- JWT 签发后立即返回
```

