## API 3: 密码登录

```
POST /api/v1/auth/login
Auth: 不需要
SLO: P99 < 200ms

Request Body:
{
  "email": "user@example.com",
  "password": "MyPass123"
}

Response 200:
{
  "code": "000000",
  "data": {
    "accessToken": "eyJhbGciOi...",
    "refreshToken": "eyJhbGciOi...",
    "expiresIn": 1800,
    "userId": 10001,
    "nickname": "股民小张"
  }
}

Error Codes:
- AUTH_LOGIN_FAILED: 用户名或密码错误
- AUTH_ACCOUNT_LOCKED: 账号已锁定，请30分钟后重试

实现说明:
- Caffeine 缓存锁定状态检查（<1ms 快速拒绝）
- BCrypt cost=12 验证 (~100ms)
- 连续失败 5 次锁定 30 分钟，Caffeine + Redis 双写
```

