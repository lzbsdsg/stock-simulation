# 股市仿真交易系统 — OpenAPI 草案

> 版本：2.0-draft | 基础路径：/api/v1 | 鉴权：Bearer JWT
> 变更：v2.0 整合百万用户高并发设计（限流头、缓存标识、背压协议、SLO标注）

---

## 统一响应格式

```yaml
# 成功
{
  "code": "000000",
  "message": "success",
  "data": { ... },
  "traceId": "uuid",
  "timestamp": "ISO8601"
}

# 失败
{
  "code": "AUTH_LOGIN_FAILED",
  "message": "用户名或密码错误",
  "data": null,
  "traceId": "uuid",
  "timestamp": "ISO8601"
}

# 分页
{
  "code": "000000",
  "data": { "records": [...], "total": 100, "page": 1, "size": 20 }
}
```

## 统一响应头

所有受限流保护的接口，响应中包含以下头：

| Header | 说明 |
|---|---|
| `X-RateLimit-Limit` | 当前窗口限额 |
| `X-RateLimit-Remaining` | 当前窗口剩余额度 |
| `X-RateLimit-Reset` | 窗口重置时间 (Unix timestamp) |
| `X-Cache-Status` | 缓存命中状态：HIT-L1 / HIT-L2 / MISS / STALE |
| `X-Request-Id` | 等于 traceId，全链路追踪标识 |

