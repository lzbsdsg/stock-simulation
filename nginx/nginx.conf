# ============================================================
# Nginx 反向代理 + 限流 + WebSocket 粘性
# ============================================================

events {
    worker_connections 1024;
}

http {
    # 全局限流区 — 单 IP 100 req/s
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;

    # WebSocket 连接限流
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    upstream app_backend {
        # 开发环境默认转发到宿主机后端（mvn spring-boot:run）
        # 生产/容器多实例可替换为：
        # server app-1:8080;
        # server app-2:8080;
        server host.docker.internal:8080;
    }

    upstream ws_backend {
        ip_hash;
        server host.docker.internal:8080;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    server {
        listen 80;
        server_name localhost;

        # 全局限流
        limit_req zone=global burst=50 nodelay;

        # 静态资源（Vue 前端）
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API 反向代理
        location /api/ {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
        }

        # Swagger / OpenAPI 反向代理
        location /swagger-ui/ {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /v3/api-docs {
            proxy_pass http://app_backend/v3/api-docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v3/api-docs/ {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Actuator 反向代理（含 /actuator/prometheus）
        location /actuator/ {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 代理（STOMP over SockJS）
        location /ws/ {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # WS 超时 — 保持长连接
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 连接数限制
            limit_conn ws_conn 5;
        }

        # 健康检查端点
        location /actuator/health {
            proxy_pass http://app_backend;
            access_log off;
        }
    }
}
