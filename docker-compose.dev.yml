# docker-compose.dev.yml — 开发环境完整生产级编排
# 用法: docker compose -f docker-compose.dev.yml up -d
# 架构: PG 1主2从 + Redis 3主3从集群 + RabbitMQ + Nginx

services:
  # ============================================================
  # PostgreSQL 主从复制集群 (1主2从)
  # ============================================================
  
  pg-master:
    image: ${PG_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bitnami/postgresql:16}
    container_name: stock-pg-master
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_USERNAME=stock_app
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=stock_simulation
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg-master-data:/bitnami/postgresql
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_simulation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pg-slave1:
    image: ${PG_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bitnami/postgresql:16}
    container_name: stock-pg-slave1
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_USERNAME=stock_app
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=pg-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "5433:5432"
    depends_on:
      pg-master:
        condition: service_healthy
    volumes:
      - pg-slave1-data:/bitnami/postgresql
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_simulation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pg-slave2:
    image: ${PG_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/bitnami/postgresql:16}
    container_name: stock-pg-slave2
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_USERNAME=stock_app
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=pg-master
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
    ports:
      - "5434:5432"
    depends_on:
      pg-master:
        condition: service_healthy
    volumes:
      - pg-slave2-data:/bitnami/postgresql
    networks:
      - stock-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_simulation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================================================
  # Redis Cluster (3主3从) - 使用官方镜像
  # ============================================================
  
  redis-node-1:
    image: redis:7-alpine
    container_name: stock-redis-1
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7000:7000"
      - "17000:17000"
    volumes:
      - ./redis/redis-node-1.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-1-data:/data
    networks:
      stock-network:
        ipv4_address: 172.29.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-node-2:
    image: redis:7-alpine
    container_name: stock-redis-2
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - ./redis/redis-node-2.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-2-data:/data
    networks:
      stock-network:
        ipv4_address: 172.29.0.12
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-node-3:
    image: redis:7-alpine
    container_name: stock-redis-3
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - ./redis/redis-node-3.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-3-data:/data
    networks:
      stock-network:
        ipv4_address: 172.29.0.13
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-node-4:
    image: redis:7-alpine
    container_name: stock-redis-4
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - ./redis/redis-node-4.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-4-data:/data
    networks:
      stock-network:
        ipv4_address: 172.29.0.14
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-node-5:
    image: redis:7-alpine
    container_name: stock-redis-5
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - ./redis/redis-node-5.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-5-data:/data
    networks:
      stock-network:
        ipv4_address: 172.29.0.15
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-node-6:
    image: redis:7-alpine
    container_name: stock-redis-6
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - ./redis/redis-node-6.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-6-data:/data
    networks:
      stock-network:
        ipv4_address: 172.29.0.16
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Redis 集群初始化器（一次性任务）
  redis-cluster-init:
    image: redis:7-alpine
    container_name: stock-redis-init
    command:
      - sh
      - -c
      - |
        sleep 10
        if redis-cli -h redis-node-1 -p 7000 -a ${REDIS_PASSWORD} cluster info 2>/dev/null | grep -q 'cluster_state:ok'; then
          echo 'Redis cluster already initialized, skipping'
          exit 0
        fi
        echo 'yes' | redis-cli -a ${REDIS_PASSWORD} --cluster create \
          redis-node-1:7000 \
          redis-node-2:7001 \
          redis-node-3:7002 \
          redis-node-4:7003 \
          redis-node-5:7004 \
          redis-node-6:7005 \
          --cluster-replicas 1
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    networks:
      - stock-network

  # ============================================================
  # RabbitMQ
  # ============================================================
  
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stock-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=stock_app
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "61613:61613"
      - "15672:15672"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - stock-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ============================================================
  # 非生产观测栈（按需启用，不影响默认开发启动链路）
  # 启动方式: docker compose -f docker-compose.dev.yml --profile nonprod-observe up -d
  # ============================================================

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: stock-postgres-exporter
    profiles:
      - nonprod-observe
    environment:
      - DATA_SOURCE_URI=pg-master:5432/stock_simulation?sslmode=disable
      - DATA_SOURCE_USER=stock_app
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD}
    ports:
      - "9187:9187"
    depends_on:
      pg-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - stock-network

  loki:
    image: grafana/loki:3.0.0
    container_name: stock-loki
    profiles:
      - nonprod-observe
    user: "0:0"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/tmp/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - stock-network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: stock-promtail
    profiles:
      - nonprod-observe
    command: ["-config.file=/etc/promtail/promtail.yml"]
    ports:
      - "9080:9080"
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log/stock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/promtail", "-version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - stock-network

  tempo:
    image: grafana/tempo:2.5.0
    container_name: stock-tempo
    profiles:
      - nonprod-observe
    user: "0:0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"
      - "4318:4318"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - stock-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: stock-prometheus
    profiles:
      - nonprod-observe
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      postgres-exporter:
        condition: service_healthy
      tempo:
        condition: service_healthy
      promtail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - stock-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: stock-grafana
    profiles:
      - nonprod-observe
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/observability-overview.json
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - stock-network

  # ============================================================
  # 非生产环境应用实例（按需启用，不影响默认开发容器）
  # 启动方式: docker compose -f docker-compose.dev.yml --profile nonprod-app up -d app-1 app-2
  # ============================================================

  app-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    image: stock-simulation:dev
    container_name: stock-app-1
    profiles:
      - nonprod-app
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=pg-master
      - DB_PORT=5432
      - DB_MASTER_HOST=pg-master
      - DB_MASTER_PORT=5432
      - DB_SLAVE_HOST=pg-slave1
      - DB_SLAVE_PORT=5432
      - DB_NAME=stock_simulation
      - DB_USER=stock_app
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CLUSTER_NODES=172.29.0.11:7000,172.29.0.12:7001,172.29.0.13:7002,172.29.0.14:7003,172.29.0.15:7004,172.29.0.16:7005
      - APP_REDIS_CLUSTER_MAP_TO_LOOPBACK=false
      - REDIS_POOL_MAX_ACTIVE=128
      - REDIS_POOL_MAX_IDLE=64
      - REDIS_POOL_MIN_IDLE=16
      - REDIS_CLUSTER_REFRESH_ADAPTIVE=true
      - REDIS_CLUSTER_REFRESH_PERIOD=15s
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=stock_app
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SERVER_TOMCAT_THREADS_MAX=600
      - SERVER_TOMCAT_THREADS_MIN_SPARE=80
      - SERVER_TOMCAT_ACCEPT_COUNT=40000
      - SERVER_TOMCAT_MAX_CONNECTIONS=100000
      - DB_MASTER_MAX_POOL_SIZE=50
      - DB_SLAVE_MAX_POOL_SIZE=80
      - MARKET_INGEST_ENABLED=true
      - MARKET_INGEST_ACTIVE_BATCH_SIZE=120
      - MARKET_INGEST_ROUND_ROBIN_BATCH_SIZE=20
      - MARKET_BROADCAST_MODE=redis
      - MARKET_REDIS_PUBSUB_ENABLED=true
      - MARKET_WS_BROKER_RELAY_ENABLED=false
      - MARKET_WS_BROKER_RELAY_HOST=rabbitmq
      - MARKET_WS_BROKER_RELAY_PORT=61613
      - MARKET_WS_BROKER_CLIENT_LOGIN=stock_app
      - MARKET_WS_BROKER_CLIENT_PASSCODE=${RABBITMQ_DEFAULT_PASS}
      - MARKET_WS_BROKER_SYSTEM_LOGIN=stock_app
      - MARKET_WS_BROKER_SYSTEM_PASSCODE=${RABBITMQ_DEFAULT_PASS}
      - MARKET_WS_BROKER_VIRTUAL_HOST=/
      - MARKET_WS_ATTACH_PUSH_TIMESTAMP=true
      - JWT_SECRET=${JWT_SECRET}
      - DEV_BASIC_AUTH_USER=${DEV_BASIC_AUTH_USER:-dev}
      - DEV_BASIC_AUTH_PASSWORD=${DEV_BASIC_AUTH_PASSWORD}
      - APP_SECURITY_K6_BYPASS_ENABLED=true
      - APP_SECURITY_K6_BYPASS_KEY=${APP_SECURITY_K6_BYPASS_KEY:-k6-bypass-20260420}
      - APP_SECURITY_K6_BYPASS_USER_ID=${APP_SECURITY_K6_BYPASS_USER_ID:-3}
      - APP_ASYNC_CORE_POOL_SIZE=16
      - APP_ASYNC_MAX_POOL_SIZE=64
      - APP_ASYNC_QUEUE_CAPACITY=2000
      - APP_RABBIT_MATCH_PREFETCH=30
      - APP_RABBIT_MATCH_CONCURRENT_CONSUMERS=12
      - APP_RABBIT_MATCH_MAX_CONCURRENT_CONSUMERS=24
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - JAVA_OPTS=-XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:MaxGCPauseMillis=100 -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/./urandom
    volumes:
      - ./logs/app-1:/app/logs
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "18080:8080"
      - "18081:8081"
    depends_on:
      pg-master:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - stock-network

  app-2:
    image: stock-simulation:dev
    container_name: stock-app-2
    profiles:
      - nonprod-app
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=pg-master
      - DB_PORT=5432
      - DB_MASTER_HOST=pg-master
      - DB_MASTER_PORT=5432
      - DB_SLAVE_HOST=pg-slave2
      - DB_SLAVE_PORT=5432
      - DB_NAME=stock_simulation
      - DB_USER=stock_app
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_CLUSTER_NODES=172.29.0.11:7000,172.29.0.12:7001,172.29.0.13:7002,172.29.0.14:7003,172.29.0.15:7004,172.29.0.16:7005
      - APP_REDIS_CLUSTER_MAP_TO_LOOPBACK=false
      - REDIS_POOL_MAX_ACTIVE=128
      - REDIS_POOL_MAX_IDLE=64
      - REDIS_POOL_MIN_IDLE=16
      - REDIS_CLUSTER_REFRESH_ADAPTIVE=true
      - REDIS_CLUSTER_REFRESH_PERIOD=15s
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=stock_app
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SERVER_TOMCAT_THREADS_MAX=600
      - SERVER_TOMCAT_THREADS_MIN_SPARE=80
      - SERVER_TOMCAT_ACCEPT_COUNT=40000
      - SERVER_TOMCAT_MAX_CONNECTIONS=100000
      - DB_MASTER_MAX_POOL_SIZE=50
      - DB_SLAVE_MAX_POOL_SIZE=80
      - MARKET_INGEST_ENABLED=false
      - MARKET_INGEST_ACTIVE_BATCH_SIZE=120
      - MARKET_INGEST_ROUND_ROBIN_BATCH_SIZE=20
      - MARKET_BROADCAST_MODE=redis
      - MARKET_REDIS_PUBSUB_ENABLED=true
      - MARKET_WS_BROKER_RELAY_ENABLED=false
      - MARKET_WS_BROKER_RELAY_HOST=rabbitmq
      - MARKET_WS_BROKER_RELAY_PORT=61613
      - MARKET_WS_BROKER_CLIENT_LOGIN=stock_app
      - MARKET_WS_BROKER_CLIENT_PASSCODE=${RABBITMQ_DEFAULT_PASS}
      - MARKET_WS_BROKER_SYSTEM_LOGIN=stock_app
      - MARKET_WS_BROKER_SYSTEM_PASSCODE=${RABBITMQ_DEFAULT_PASS}
      - MARKET_WS_BROKER_VIRTUAL_HOST=/
      - MARKET_WS_ATTACH_PUSH_TIMESTAMP=true
      - JWT_SECRET=${JWT_SECRET}
      - DEV_BASIC_AUTH_USER=${DEV_BASIC_AUTH_USER:-dev}
      - DEV_BASIC_AUTH_PASSWORD=${DEV_BASIC_AUTH_PASSWORD}
      - APP_SECURITY_K6_BYPASS_ENABLED=true
      - APP_SECURITY_K6_BYPASS_KEY=${APP_SECURITY_K6_BYPASS_KEY:-k6-bypass-20260420}
      - APP_SECURITY_K6_BYPASS_USER_ID=${APP_SECURITY_K6_BYPASS_USER_ID:-3}
      - APP_ASYNC_CORE_POOL_SIZE=16
      - APP_ASYNC_MAX_POOL_SIZE=64
      - APP_ASYNC_QUEUE_CAPACITY=2000
      - APP_RABBIT_MATCH_PREFETCH=30
      - APP_RABBIT_MATCH_CONCURRENT_CONSUMERS=12
      - APP_RABBIT_MATCH_MAX_CONCURRENT_CONSUMERS=24
      - MANAGEMENT_HEALTH_MAIL_ENABLED=false
      - JAVA_OPTS=-XX:+UseG1GC -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:MaxGCPauseMillis=100 -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -Djava.security.egd=file:/dev/./urandom
    volumes:
      - ./logs/app-2:/app/logs
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "28080:8080"
      - "28081:8081"
    depends_on:
      pg-master:
        condition: service_healthy
      redis-node-1:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      app-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - stock-network

  # ============================================================
  # Nginx
  # ============================================================
  
  nginx:
    image: nginx:alpine
    container_name: stock-nginx
    profiles:
      - nonprod-app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./stock-simulation-web/dist:/usr/share/nginx/html:ro
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  pg-master-data:
  pg-slave1-data:
  pg-slave2-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
  rabbitmq-data:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data:
