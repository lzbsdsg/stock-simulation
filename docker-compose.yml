services:
  # ============================================================
  # Nginx 入口（前端静态 + API 反向代理 + 限流 + WS 粘性 + SSL终止）
  # ============================================================
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-nginx
    container_name: stock-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app-1:
        condition: service_started
      app-2:
        condition: service_started
    restart: unless-stopped
    networks:
      - stock-network

  # ============================================================
  # Spring Boot 应用集群（2实例）
  # ============================================================
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    container_name: stock-app-1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
      DB_MASTER_HOST: pg-master
      DB_MASTER_PORT: 5432
      DB_SLAVE_HOST: pg-slave-1
      DB_SLAVE_PORT: 5432
      DB_NAME: stock_simulation
      DB_USER: stock_app
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLUSTER_NODES: redis-node-1:7000,redis-node-2:7001,redis-node-3:7002,redis-node-4:7003,redis-node-5:7004,redis-node-6:7005
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-stock_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      pg-master:
        condition: service_healthy
      pg-slave-1:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "18080:8080"
      - "18081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped
    networks:
      - stock-network

  app-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    container_name: stock-app-2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8081
      DB_MASTER_HOST: pg-master
      DB_MASTER_PORT: 5432
      DB_SLAVE_HOST: pg-slave-2
      DB_SLAVE_PORT: 5432
      DB_NAME: stock_simulation
      DB_USER: stock_app
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLUSTER_NODES: redis-node-1:7000,redis-node-2:7001,redis-node-3:7002,redis-node-4:7003,redis-node-5:7004,redis-node-6:7005
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-stock_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      pg-master:
        condition: service_healthy
      pg-slave-2:
        condition: service_healthy
      redis-cluster-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "28080:8080"
      - "28081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped
    networks:
      - stock-network

  # ============================================================
  # PostgreSQL 主从（Streaming Replication）
  # ============================================================
  pg-master:
    image: postgres:16-alpine
    container_name: stock-pg-master
    environment:
      POSTGRES_DB: stock_simulation
      POSTGRES_USER: stock_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=16
      -c max_replication_slots=16
      -c wal_keep_size=512MB
      -c hot_standby=on
    volumes:
      - pg-master-data:/var/lib/postgresql/data
      - ./postgres/master/init/01-create-replication-user.sh:/docker-entrypoint-initdb.d/01-create-replication-user.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_simulation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - stock-network

  pg-slave-1:
    image: postgres:16-alpine
    container_name: stock-pg-slave-1
    environment:
      POSTGRES_DB: stock_simulation
      POSTGRES_USER: stock_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      REPLICATION_SLOT_NAME: slave_1_slot
      REPLICA_APP_NAME: pg-slave-1
    entrypoint: ["sh", "/usr/local/bin/init-replica.sh"]
    volumes:
      - pg-slave-1-data:/var/lib/postgresql/data
      - ./postgres/replica/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    depends_on:
      pg-master:
        condition: service_healthy
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_simulation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - stock-network

  pg-slave-2:
    image: postgres:16-alpine
    container_name: stock-pg-slave-2
    environment:
      POSTGRES_DB: stock_simulation
      POSTGRES_USER: stock_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-repl_user}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      REPLICATION_SLOT_NAME: slave_2_slot
      REPLICA_APP_NAME: pg-slave-2
    entrypoint: ["sh", "/usr/local/bin/init-replica.sh"]
    volumes:
      - pg-slave-2-data:/var/lib/postgresql/data
      - ./postgres/replica/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    depends_on:
      pg-master:
        condition: service_healthy
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_app -d stock_simulation"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - stock-network

  # ============================================================
  # Redis Cluster（3主3从）
  # ============================================================
  redis-node-1:
    image: redis:7-alpine
    container_name: stock-redis-1
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "7000:7000"
      - "17000:17000"
    volumes:
      - ./redis/redis-node-1.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-1-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  redis-node-2:
    image: redis:7-alpine
    container_name: stock-redis-2
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - ./redis/redis-node-2.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-2-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  redis-node-3:
    image: redis:7-alpine
    container_name: stock-redis-3
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - ./redis/redis-node-3.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-3-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  redis-node-4:
    image: redis:7-alpine
    container_name: stock-redis-4
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - ./redis/redis-node-4.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-4-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  redis-node-5:
    image: redis:7-alpine
    container_name: stock-redis-5
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - ./redis/redis-node-5.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-5-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  redis-node-6:
    image: redis:7-alpine
    container_name: stock-redis-6
    command: >
      sh -c "sed 's/__REDIS_PASSWORD__/'\"$${REDIS_PASSWORD}\"'/g' /usr/local/etc/redis/redis.conf.template > /tmp/redis.conf && redis-server /tmp/redis.conf"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - ./redis/redis-node-6.conf:/usr/local/etc/redis/redis.conf.template:ro
      - redis-node-6-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - stock-network

  redis-cluster-init:
    image: redis:7-alpine
    container_name: stock-redis-cluster-init
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./redis/init-cluster.sh:/usr/local/bin/init-cluster.sh:ro
    entrypoint: ["sh", "/usr/local/bin/init-cluster.sh"]
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      redis-node-4:
        condition: service_healthy
      redis-node-5:
        condition: service_healthy
      redis-node-6:
        condition: service_healthy
    restart: "no"
    networks:
      - stock-network

  # ============================================================
  # RabbitMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stock-rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stock_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - stock-network

  # ============================================================
  # Observability
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: stock-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      app-1:
        condition: service_started
      app-2:
        condition: service_started
    restart: unless-stopped
    networks:
      - stock-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: stock-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - stock-network

  loki:
    image: grafana/loki:2.9.0
    container_name: stock-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge

volumes:
  pg-master-data:
  pg-slave-1-data:
  pg-slave-2-data:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:
  rabbitmq-data:
  grafana-data:
